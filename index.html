<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: 'Noto Serif KR', serif;
    text-align: center;
}

.wrapper {
    max-width: 480px;
    margin: auto;
    padding: 40px 20px;
}

.photo {
    width: 100%;
    height: 320px;
    object-fit: cover;
    border: 1px solid #fff;
}

h1 {
    font-weight: 300;
    letter-spacing: 3px;
    margin-top: 30px;
}

.divider {
    width: 40px;
    height: 1px;
    background: #fff;
    margin: 25px auto;
}

.info {
    font-size: 15px;
    letter-spacing: 1px;
    margin: 8px 0;
}

.section {
    margin-top: 60px;
}

/* 입력 영역 (관리자용) */
.admin {
    background: #111;
    padding: 20px;
    margin-top: 60px;
    border-top: 1px solid #333;
}

input {
    width: 90%;
    padding: 8px;
    margin: 5px 0;
    background: #000;
    border: 1px solid #fff;
    color: #fff;
}

button {
    margin-top: 10px;
    padding: 8px 20px;
    background: #fff;
    border: none;
    color: #000;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="wrapper">

    <img id="mainPhoto" class="photo" src="https://via.placeholder.com/600x400">

    <h1 id="names">GROOM & BRIDE</h1>

    <div class="divider"></div>

    <div class="info" id="date">2026. 00. 00 SAT 00:00 PM</div>
    <div class="info" id="place">Wedding Hall Name</div>
    <div class="info" id="address">Seoul, Korea</div>

    <div class="section">
        <div class="info">
            저희 두 사람이 사랑으로 만나<br>
            인생의 새로운 시작을 함께하려 합니다.<br><br>
            소중한 걸음으로 축복해주시면 감사하겠습니다.
        </div>
    </div>

</div>

<!-- 관리자 수정 영역 -->
<div class="admin">
    <h3>관리자 수정</h3>
    <input id="groom" placeholder="신랑 이름">
    <input id="bride" placeholder="신부 이름">
    <input id="wdate" placeholder="날짜 및 시간">
    <input id="wplace" placeholder="예식장 이름">
    <input id="waddress" placeholder="주소">
    <input id="photoUrl" placeholder="사진 URL">
    <br>
    <button onclick="updateCard()">적용하기</button>
</div>

<script>
function updateCard() {
    document.getElementById("names").innerText =
        document.getElementById("groom").value + " & " +
        document.getElementById("bride").value;

    document.getElementById("date").innerText =
        document.getElementById("wdate").value;

    document.getElementById("place").innerText =
        document.getElementById("wplace").value;

    document.getElementById("address").innerText =
        document.getElementById("waddress").value;

    document.getElementById("mainPhoto").src =
        document.getElementById("photoUrl").value;
}
</script>

</body>
</html>
